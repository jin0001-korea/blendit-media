<h1>blendit-media</h1>

<p>@blendit_social 인스타그램 발행용 이미지 호스팅입니다.</p>

<p class="muted">
  Instagram Content Publishing API는 이미지 바이너리 업로드를 받지 않고,
  인증 없이 접근 가능한 HTTPS URL만 받습니다. 이 저장소는 그 URL을 제공하기 위해 존재합니다.
  발행이 끝난 이미지는 인스타그램에 이미 공개된 것과 동일한 내용입니다.
</p>

<h2>구조</h2>
<pre><code>posts/&lt;YYYY-MM-DD&gt;-&lt;슬러그&gt;/01.jpg ... 10.jpg</code></pre>

<p class="muted">기획안·원고·템플릿 등 비공개 자료는 별도 private 저장소에 있습니다.</p>
